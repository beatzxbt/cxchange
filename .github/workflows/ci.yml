name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run release tests with overflow checks
        run: CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true cargo test --workspace --release

  reference:
    name: Python reference and differential checks
    runs-on: ubuntu-latest
    needs: native
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: reference/python/uv.lock
      - name: Install Python 3.14.8
        run: uv python install 3.14.8
      - name: Install Python reference dependencies
        run: uv sync --directory reference/python --extra dev
      - name: Run Python reference tests
        run: uv run --directory reference/python --extra dev pytest
      - name: Type-check reference and comparator
        run: uv run --directory reference/python --extra dev ty check src/ tests/ ../../tools/differential.py
      - name: Lint the comparator
        run: uv run --directory reference/python --extra dev ruff check ../../tools/differential.py
      - name: Build the replay CLI
        run: cargo build --release --bin cxchange-replay
      - name: Compare replay results
        run: uv run --directory reference/python --extra dev python ../../tools/differential.py
