[project]
name = "cxchange"
version = "0.1.0"
description = "a high performance, centralized, crypto exchange implementation"
authors = [
    {name = "beatzxbt", email = "121855680+beatzxbt@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "msgspec>=0.18.6",
    "aiohttp>=3.9.0",
    "aiohttp-cors>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6.4",
    "ty>=0.0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cxchange"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]

[tool.ty.environment]
python-version = "3.13"
